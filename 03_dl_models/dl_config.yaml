# Configuration for the 2.5D deep-learning models.
#
# Random seeds are fixed so that the training and the comparison of networks are reproducible.
# Model weights are written to the run output directory on the local filesystem only and are never
# committed to this repository.

seed: 42

# ---------------------------------------------------------------------------------------------
# Candidate 2.5D networks
# ---------------------------------------------------------------------------------------------
# The 32 candidates below are exactly the networks compared in the manuscript
# (Figure 1C, pre-nICT, and Figure 1D, post-nICT; the same 32 networks were compared at both time
# points). Training and test AUCs for each of them are shown in Figure 1C/1D.
candidates:
  - SimpleViT                  # lightweight patch-attention baseline
  - ViT                        # torchvision ViT-B/16
  - mobilenet_v3_small
  - resnet34
  - shufflenet_v2_x1_0
  - mobilenet_v2
  - resnet50
  - mnasnet0_5
  - resnext50_32x4d
  - densenet121
  - resnet18
  - squeezenet1_0
  - wide_resnet101_2
  - densenet161
  - googlenet
  - shufflenet_v2_x0_5
  - resnet152
  - alexnet
  - vgg16
  - densenet169
  - densenet201
  - inception_v3
  - wide_resnet50_2
  - resnet101
  - vgg13_bn
  - vgg16_bn
  - vgg13
  - mnasnet1_0
  - squeezenet1_1
  - vgg19
  - mobilenet_v3_large
  - vgg19_bn

# The zoo in models_2p5d.py contains 48 further architectures that were available but not selected
# as candidates; run `python -c "from models_2p5d import MODEL_NAMES; print(MODEL_NAMES)"` to list
# them all.

# Set to true to train the pre-/post-nICT inputs as a 6-channel input instead of two separate
# 3-channel inputs.
combine_timepoints: false

# Default model (used when train_dl.py is called without --model).
model: SimpleViT

# Set to true to initialise from ImageNet weights.
pretrained: false

image_size: 256              # the manuscript resized all 2.5D views to 256 x 256 pixels
                             # (inception_v3 conventionally expects 299 x 299)
batch_size: 16
epochs: 100
lr: 0.0001
weight_decay: 0.0001
early_stopping_patience: 15
val_fraction: 0.2

# Device: 'cuda' if available, otherwise 'cpu' (resolved automatically in train_dl.py).
# The manuscript results were produced on an NVIDIA GeForce RTX 5090 (32 GB) with CUDA 12.8.

smoke_n: 16                  # number of synthetic cases used by --smoke-test
smoke_size: 224              # spatial size of the synthetic cases used by --smoke-test
                             # (inception_v3 automatically uses 299)
